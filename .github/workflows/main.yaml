name: Build main
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  set-version:
    name: Set version
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: set version
        id: set-version
        run: |
          echo Faking a Semantic Version
          echo "version=1.$(date "+%Y%m%d%H%M%S")" >> ${GITHUB_OUTPUT}

  build:
    name: Build and push
    needs:
      - set-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILDER_IMG: "chainguard/go"
      RUNNER_IMG: "chainguard/static"
      IMG_IDENTITY: "https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main"
      IMG_ISSUER: "https://token.actions.githubusercontent.com"
    outputs:
      tag: "${{ steps.docker-build-push.outputs.IMAGE }}"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # ratchet:actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # ratchet:sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.1.3'
      - name: Verify images
        run: |
          cosign verify --certificate-identity ${IMG_IDENTITY} --certificate-oidc-issuer ${IMG_ISSUER} ${BUILDER_IMG}
          cosign verify --certificate-identity ${IMG_IDENTITY} --certificate-oidc-issuer ${IMG_ISSUER} ${RUNNER_IMG}
        env:
          IMG_IDENTITY: ${{ env.IMG_IDENTITY }}
          IMG_ISSUER: ${{ env.IMG_ISSUER }} 
          RUNNER_IMG: ${{ env.RUNNER_IMG }}
          BUILDER_IMG: ${{ env.BUILDER_IMG }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # ratchet:docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # ratchet:docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # ratchet:docker/build-push-action@v7
        with:
          push: true
          tags: jksolbakken/helloworld:${{ env.TAG }}
          platforms: linux/amd64,linux/arm64
        env:
          TAG: ${{ needs.set-version.outputs.version }}

