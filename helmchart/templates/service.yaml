apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.appName }}
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
spec:
  ports:
  - port: {{ .Values.svcport }}
    protocol: TCP
    targetPort: {{ .Values.containerport }}
  selector:
    app: {{ .Values.appName }}
  type: ClusterIP

